<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Trap the Cat">
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17111d"/>
      <stop offset="100%" stop-color="#221a29"/>
    </linearGradient>
    <linearGradient id="tc-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5dd39e"/>
      <stop offset="100%" stop-color="#bce784"/>
    </linearGradient>
    <radialGradient id="tc-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5dd39e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5dd39e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#tc-bg)"/>
  <circle cx="400" cy="240" r="170" fill="url(#tc-halo)"/>

  <!-- open tiles -->
  <g fill="none" stroke="#6b7280" stroke-width="2" opacity="0.5">
    <circle cx="226" cy="150" r="17"/><circle cx="284" cy="150" r="17"/><circle cx="342" cy="150" r="17"/>
    <circle cx="458" cy="150" r="17"/><circle cx="516" cy="150" r="17"/><circle cx="574" cy="150" r="17"/>
    <circle cx="255" cy="195" r="17"/><circle cx="313" cy="195" r="17"/>
    <circle cx="487" cy="195" r="17"/><circle cx="545" cy="195" r="17"/>
    <circle cx="226" cy="240" r="17"/><circle cx="284" cy="240" r="17"/>
    <circle cx="516" cy="240" r="17"/><circle cx="574" cy="240" r="17"/>
    <circle cx="255" cy="285" r="17"/><circle cx="313" cy="285" r="17"/>
    <circle cx="487" cy="285" r="17"/><circle cx="545" cy="285" r="17"/>
    <circle cx="226" cy="330" r="17"/><circle cx="284" cy="330" r="17"/><circle cx="342" cy="330" r="17"/>
    <circle cx="458" cy="330" r="17"/><circle cx="516" cy="330" r="17"/><circle cx="574" cy="330" r="17"/>
  </g>

  <!-- blocked tiles closing in -->
  <g fill="url(#tc-grad)">
    <circle cx="400" cy="150" r="17"/>
    <circle cx="371" cy="195" r="17"/><circle cx="429" cy="195" r="17"/>
    <circle cx="342" cy="240" r="17"/><circle cx="458" cy="240" r="17"/>
    <circle cx="371" cy="285" r="17"/><circle cx="429" cy="285" r="17"/>
    <circle cx="400" cy="330" r="17"/>
  </g>

  <!-- the cat, cornered in the middle -->
  <g transform="translate(400 240)">
    <path d="M-20-14-27-32l16 7zM20-14 27-32l-16 7z" fill="#f0f3ec"/>
    <ellipse cx="0" cy="0" rx="26" ry="22" fill="#f0f3ec"/>
    <g fill="#17111d">
      <ellipse cx="-9" cy="-3" rx="3.4" ry="4.6"/>
      <ellipse cx="9" cy="-3" rx="3.4" ry="4.6"/>
      <path d="M0 6l-4 3h8z"/>
    </g>
    <g stroke="#17111d" stroke-width="1.4" stroke-linecap="round" opacity="0.65">
      <path d="M-14 7h-11M-14 11l-10 3M14 7h11M14 11l10 3"/>
    </g>
  </g>

  <text x="400" y="74" text-anchor="middle" font-family="Space Grotesk, Poppins, Arial, sans-serif"
        font-size="44" font-weight="700" letter-spacing="2" fill="#f0f3ec">TRAP THE CAT</text>
  <text x="400" y="408" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace"
        font-size="16" letter-spacing="3" fill="#5dd39e">UNITY &#183; C# &#183; PUZZLE</text>
</svg>
